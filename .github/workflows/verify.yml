name: Anna HYROX · Quality checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - run: node tests/validate-plan.mjs
      - run: node tests/validate-static.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'playwright>=1.55,<1.60'
      - run: python -m playwright install --with-deps chromium
      - run: python tests/smoke_ui.py
