name: Validate Anna HYROX 2
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Validate all Excel-derived training entries
        run: node tests/validate-plan.mjs
      - name: Verify PWA deployment assets
        run: |
          test -s index.html
          test -s app.js
          test -s styles.css
          test -s plan.json
          test -s sw.js
          test -s manifest.webmanifest
          test -s icon-192.png
          test -s icon-512.png
          test -s icon.svg
          grep -q 'Anna HYROX' index.html
